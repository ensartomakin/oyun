<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karakter Seçimi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      color: #fff;
    }
    #ui {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      pointer-events: none;
      z-index: 10;
    }
    #title {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 30px rgba(255,255,255,0.4);
    }
    #subtitle {
      position: fixed;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
    }
    #char-bar {
      pointer-events: all;
      display: flex;
      gap: 16px;
      padding: 20px 32px;
      margin-bottom: 32px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
    }
    .char-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .char-btn:hover { transform: translateY(-4px); }
    .char-btn.active .char-icon {
      border-color: #fff;
      box-shadow: 0 0 20px rgba(255,255,255,0.5);
    }
    .char-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      transition: all 0.2s;
    }
    .char-name {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }
    #char-info {
      position: fixed;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }
    #char-info h2 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }
    #char-info p {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.1em;
      margin-top: 4px;
    }
    #canvas-container { width: 100vw; height: 100vh; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="ui">
    <div id="title">Karakter Seçimi</div>
    <div id="subtitle">3D Figürler</div>
    <div id="char-info">
      <h2 id="char-name-display">Beşiktaş Hero</h2>
      <p id="char-desc-display">Süper Kahraman Koleksiyonu</p>
    </div>
    <div id="char-bar">
      <div class="char-btn active" data-id="0" onclick="selectChar(0)">
        <div class="char-icon" style="background:linear-gradient(135deg,#c0392b,#2c3e50)">🕷️</div>
        <span class="char-name">Kahraman</span>
      </div>
      <div class="char-btn" data-id="1" onclick="selectChar(1)">
        <div class="char-icon" style="background:linear-gradient(135deg,#e91e8c,#3498db)">💗</div>
        <span class="char-name">K Kalp</span>
      </div>
      <div class="char-btn" data-id="2" onclick="selectChar(2)">
        <div class="char-icon" style="background:linear-gradient(135deg,#8e44ad,#e67e22)">⚡</div>
        <span class="char-name">Sihirbaz</span>
      </div>
      <div class="char-btn" data-id="3" onclick="selectChar(3)">
        <div class="char-icon" style="background:linear-gradient(135deg,#2c3e50,#7f8c8d)">🦇</div>
        <span class="char-name">Yarasa</span>
      </div>
    </div>
  </div>
  <div id="canvas-container"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
