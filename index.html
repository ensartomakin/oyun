<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kafa Topu 3D — Faz 1C</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0b1a2e; font-family: 'Segoe UI', sans-serif; }
    #c { display: block; width: 100vw; height: 100vh; }

    /* ── SKOR ÇUBUĞU ── */
    #hud {
      position: fixed; top: 0; left: 0; right: 0; height: 58px;
      display: flex; align-items: center; justify-content: center; gap: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.78), transparent);
      pointer-events: none; z-index: 20;
    }
    .hud-team {
      display: flex; align-items: center; gap: 10px;
      padding: 0 22px;
    }
    .hud-dot  { width: 12px; height: 12px; border-radius: 50%; flex-shrink:0; }
    .hud-name { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em;
                text-transform: uppercase; color: rgba(255,255,255,0.65); }
    .hud-score{ font-size: 2.2rem; font-weight: 900; color: #fff; min-width: 28px;
                text-align: center; line-height: 1; }
    #hud-mid  { display: flex; flex-direction: column; align-items: center;
                padding: 0 20px; }
    #hud-timer{ font-size: 1.65rem; font-weight: 800; color: #fff; line-height: 1; }
    #hud-timer.warn { color: #FF4422; }
    #hud-label{ font-size: 0.58rem; color: rgba(255,255,255,0.38);
                letter-spacing: 0.14em; margin-top: 2px; }

    /* ── KONTROL İPUCU ── */
    #hint {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      font-size: 0.60rem; color: rgba(255,255,255,0.28);
      letter-spacing: 0.09em; pointer-events: none; text-align: center;
    }

    /* ── YENİDEN OYNA ── */
    #btn-restart {
      display: none; position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, 72px);
      padding: 13px 42px; border-radius: 14px; border: none;
      background: #2255FF; color: #fff; font-size: 1rem;
      font-weight: 700; cursor: pointer; z-index: 35; letter-spacing: 0.06em;
    }
    #btn-restart:hover { background: #3366FF; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<!-- SKOR HUD -->
<div id="hud">
  <div class="hud-team">
    <div class="hud-dot" style="background:#3366FF"></div>
    <span class="hud-name">MAVİ</span>
    <span class="hud-score" id="score-a">0</span>
  </div>
  <div id="hud-mid">
    <div id="hud-timer">3:00</div>
    <div id="hud-label">MAÇ SÜRESİ</div>
  </div>
  <div class="hud-team">
    <span class="hud-score" id="score-b">0</span>
    <span class="hud-name">KIRMIZI</span>
    <div class="hud-dot" style="background:#FF3322"></div>
  </div>
</div>

<div id="hint">
  ← → HAREKET &nbsp;|&nbsp; ↑ ZIPLA &nbsp;|&nbsp; SPACE TEKMELE &nbsp;|&nbsp; Faz 2'de: X RÖVEŞATA · Z KAYMA · C KAFA · ENTER ŞUT
</div>
<button id="btn-restart" onclick="restartMatch()">YENİDEN OYNA</button>

<!-- GOL mesajı -->
<div id="goal-msg" style="
  display:none; position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%);
  font-size:4rem; font-weight:900; color:#FFD700;
  text-shadow: 0 0 40px rgba(255,200,0,0.9), 0 4px 16px rgba(0,0,0,0.9);
  text-transform:uppercase; letter-spacing:0.08em;
  pointer-events:none; z-index:30;
  animation: goalPop 0.25s ease-out;
">⚽ GOL!</div>
<style>
@keyframes goalPop {
  0%   { transform: translate(-50%,-50%) scale(0.4); opacity:0; }
  70%  { transform: translate(-50%,-50%) scale(1.15); opacity:1; }
  100% { transform: translate(-50%,-50%) scale(1);    opacity:1; }
}
</style>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
//  FAZ 1A — SAHA, IŞIK, KAMERA, TRİBÜN
// ═══════════════════════════════════════════════════════════════════

// ── SABİTLER ────────────────────────────────────────────────────────
const FIELD_W  = 22;   // saha genişliği (x: -11 … +11)
const FIELD_D  = 10;   // saha derinliği (z: -5 … +5)
const GOAL_H   = 2.7;  // kale yüksekliği
const GOAL_W   = 3.6;  // kale ağzı genişliği (z ekseni)
const GOAL_D   = 1.2;  // kale derinliği (x ekseni)

// ── RENDERER ────────────────────────────────────────────────────────
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.outputEncoding    = THREE.sRGBEncoding;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

// ── SAHNE ───────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1a2e);
scene.fog = new THREE.FogExp2(0x0b1a2e, 0.018);

// ── KAMERA ──────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(
  52,
  window.innerWidth / window.innerHeight,
  0.1, 120
);
camera.position.set(0, 8, 20);
camera.lookAt(0, 2, 0);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// Faz 1C: sabit oyun kamerası (OrbitControls kaldırıldı)
camera.position.set(0, 8, 20);
camera.lookAt(0, 2, 0);

// ── IŞIKLAR ─────────────────────────────────────────────────────────

// Ortam ışığı (gökyüzü mavi tonu, zemin yeşil tonu)
const hemi = new THREE.HemisphereLight(0x99bbdd, 0x224422, 0.55);
scene.add(hemi);

// Ana güneş ışığı — gölgeli
const sun = new THREE.DirectionalLight(0xfff5e0, 1.1);
sun.position.set(8, 18, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near   = 0.5;
sun.shadow.camera.far    = 60;
sun.shadow.camera.left   = -18;
sun.shadow.camera.right  =  18;
sun.shadow.camera.top    =  14;
sun.shadow.camera.bottom = -6;
sun.shadow.bias          = -0.0008;
scene.add(sun);

// Doldurma ışığı (sol + hafif soğuk)
const fill = new THREE.DirectionalLight(0x7799cc, 0.38);
fill.position.set(-8, 8, 4);
scene.add(fill);

// Arka kenar ışığı (rim)
const rim = new THREE.DirectionalLight(0xffeedd, 0.20);
rim.position.set(0, 4, -10);
scene.add(rim);

// ── SAHA ────────────────────────────────────────────────────────────

// Çim zemin
const turfMat = new THREE.MeshLambertMaterial({ color: 0x1a7a28 });
const turf = new THREE.Mesh(
  new THREE.BoxGeometry(FIELD_W, 0.22, FIELD_D),
  turfMat
);
turf.position.y = -0.11;
turf.receiveShadow = true;
scene.add(turf);

// Koyu/açık yeşil çim şeritleri (gerçek saha etkisi)
const darkTurf = new THREE.MeshLambertMaterial({ color: 0x157022 });
for (let i = 0; i < 11; i++) {
  if (i % 2 === 0) {
    const stripe = new THREE.Mesh(
      new THREE.BoxGeometry(2.0, 0.01, FIELD_D),
      darkTurf
    );
    stripe.position.set(-10 + i * 2 + 1, 0.005, 0);
    scene.add(stripe);
  }
}

// Beyaz çizgi malzemesi
const lineMat = new THREE.MeshLambertMaterial({ color: 0xffffff });

function addLine(x, z, w, d, h) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h || 0.022, d),
    lineMat
  );
  m.position.set(x, 0.011, z);
  scene.add(m);
}

// Kenar çizgileri (x ekseni boyunca)
addLine(0, -(FIELD_D / 2) + 0.06, FIELD_W, 0.12);
addLine(0,  (FIELD_D / 2) - 0.06, FIELD_W, 0.12);

// Yan çizgiler (z ekseni boyunca)
addLine(-(FIELD_W / 2) + 0.06, 0, 0.12, FIELD_D);
addLine( (FIELD_W / 2) - 0.06, 0, 0.12, FIELD_D);

// Orta çizgi
addLine(0, 0, 0.12, FIELD_D);

// Orta daire
const centerCircle = new THREE.Mesh(
  new THREE.RingGeometry(1.85, 2.0, 56),
  lineMat
);
centerCircle.rotation.x = -Math.PI / 2;
centerCircle.position.y = 0.013;
scene.add(centerCircle);

// Orta nokta
const centerDot = new THREE.Mesh(
  new THREE.CircleGeometry(0.11, 16),
  lineMat
);
centerDot.rotation.x = -Math.PI / 2;
centerDot.position.y = 0.014;
scene.add(centerDot);

// Ceza sahaları (her iki taraf)
[-1, 1].forEach(side => {
  const bx = side * (FIELD_W / 2 - 0.06);
  const pw = 2.8;   // ceza sahası derinliği
  const ph = 5.0;   // ceza sahası genişliği (z)

  // Yatay çizgiler
  addLine(bx - side * (pw / 2), -(ph / 2), pw, 0.12);
  addLine(bx - side * (pw / 2),  (ph / 2), pw, 0.12);
  // Dikey çizgi
  addLine(bx - side * pw, 0, 0.12, ph);
});

// Köşe işaretleri
[[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([sx, sz]) => {
  const c = new THREE.Mesh(new THREE.CircleGeometry(0.14, 12), lineMat);
  c.rotation.x = -Math.PI / 2;
  c.position.set(sx * (FIELD_W/2 - 0.1), 0.015, sz * (FIELD_D/2 - 0.1));
  scene.add(c);
});

// ── KALE ────────────────────────────────────────────────────────────

const postMat = new THREE.MeshPhongMaterial({
  color: 0xeeeeee, shininess: 70, specular: 0x777777
});
const netMat = new THREE.MeshPhongMaterial({
  color: 0xccddff, transparent: true, opacity: 0.20,
  side: THREE.DoubleSide, shininess: 10
});

function buildGoal(side) {
  // side: -1 = sol kale, +1 = sağ kale
  const g = new THREE.Group();
  const x = side * (FIELD_W / 2);

  // Direk yardımcı fonksiyon
  function post(px, py, pz, rx, ry, rz, len) {
    const m = new THREE.Mesh(
      new THREE.CylinderGeometry(0.075, 0.075, len, 12),
      postMat
    );
    m.position.set(px, py, pz);
    if (rx) m.rotation.x = rx;
    if (ry) m.rotation.y = ry;
    if (rz) m.rotation.z = rz;
    m.castShadow = true;
    m.receiveShadow = true;
    g.add(m);
  }

  // Sol direk
  post(x, GOAL_H / 2, -GOAL_W / 2, 0, 0, 0, GOAL_H);
  // Sağ direk
  post(x, GOAL_H / 2,  GOAL_W / 2, 0, 0, 0, GOAL_H);
  // Üst direk (yatay)
  post(x, GOAL_H, 0, Math.PI / 2, 0, 0, GOAL_W);
  // Arka direk (derinlik)
  post(x + side * GOAL_D, GOAL_H / 2, -GOAL_W / 2, 0, 0, 0, GOAL_H);
  post(x + side * GOAL_D, GOAL_H / 2,  GOAL_W / 2, 0, 0, 0, GOAL_H);
  post(x + side * GOAL_D, GOAL_H, 0, Math.PI / 2, 0, 0, GOAL_W);
  // Yan yatay çubuklar (alt)
  post(x + side * GOAL_D / 2, 0.075, -GOAL_W / 2, 0, 0, Math.PI / 2, GOAL_D);
  post(x + side * GOAL_D / 2, 0.075,  GOAL_W / 2, 0, 0, Math.PI / 2, GOAL_D);
  // Üst yatay çubuklar
  post(x + side * GOAL_D / 2, GOAL_H, -GOAL_W / 2, 0, 0, Math.PI / 2, GOAL_D);
  post(x + side * GOAL_D / 2, GOAL_H,  GOAL_W / 2, 0, 0, Math.PI / 2, GOAL_D);

  // File — arka panel
  const netBack = new THREE.Mesh(
    new THREE.PlaneGeometry(GOAL_W, GOAL_H), netMat
  );
  netBack.position.set(x + side * GOAL_D, GOAL_H / 2, 0);
  netBack.rotation.y = side < 0 ? Math.PI / 2 : -Math.PI / 2;
  g.add(netBack);

  // File — taban
  const netFloor = new THREE.Mesh(
    new THREE.PlaneGeometry(GOAL_D, GOAL_W), netMat
  );
  netFloor.rotation.x = -Math.PI / 2;
  netFloor.rotation.z = side < 0 ? 0 : Math.PI / 2;
  netFloor.position.set(x + side * GOAL_D / 2, 0.02, 0);
  g.add(netFloor);

  // File — üst
  const netTop = new THREE.Mesh(
    new THREE.PlaneGeometry(GOAL_D, GOAL_W), netMat
  );
  netTop.rotation.x = Math.PI / 2;
  netTop.rotation.z = side < 0 ? 0 : Math.PI / 2;
  netTop.position.set(x + side * GOAL_D / 2, GOAL_H, 0);
  g.add(netTop);

  // File — sol/sağ yanlar
  [-1, 1].forEach(zSide => {
    const netSide = new THREE.Mesh(
      new THREE.PlaneGeometry(GOAL_D, GOAL_H), netMat
    );
    netSide.rotation.y = zSide < 0 ? -Math.PI / 2 : Math.PI / 2;
    netSide.position.set(x + side * GOAL_D / 2, GOAL_H / 2, zSide * GOAL_W / 2);
    g.add(netSide);
  });

  scene.add(g);
}

buildGoal(-1);
buildGoal(1);

// ── TRİBÜN ──────────────────────────────────────────────────────────

function buildStands() {
  // Her iki uzun kenar için tribün basamakları
  const rowColors = [0x1a2d4a, 0x1f3555, 0x243d60, 0x2a456b, 0x304d76];
  const accentColors = [0x3355aa, 0x2244bb, 0x1133cc, 0x4466bb, 0x2255aa];

  [-1, 1].forEach(side => {
    for (let row = 0; row < 5; row++) {
      const rowDepth   = 1.8;
      const rowHeight  = 1.1;
      const zOffset    = side * (FIELD_D / 2 + 1.0 + row * rowDepth);
      const yOffset    = 0.55 + row * rowHeight;

      // Basamak zemini
      const stand = new THREE.Mesh(
        new THREE.BoxGeometry(FIELD_W * 1.35, rowHeight, rowDepth),
        new THREE.MeshLambertMaterial({ color: rowColors[row] })
      );
      stand.position.set(0, yOffset, zOffset);
      scene.add(stand);

      // Seyirci renk aksentleri (küçük renkli kutular)
      for (let col = -8; col <= 8; col++) {
        if (Math.random() > 0.4) {
          const seat = new THREE.Mesh(
            new THREE.BoxGeometry(0.55, 0.45, 0.35),
            new THREE.MeshLambertMaterial({
              color: accentColors[Math.floor(Math.random() * accentColors.length)]
            })
          );
          seat.position.set(
            col * 1.35 + (Math.random() - 0.5) * 0.4,
            yOffset + rowHeight / 2 + 0.22,
            zOffset + (Math.random() - 0.5) * 0.6
          );
          scene.add(seat);
        }
      }
    }
  });

  // Kale arkası tribünleri (kısa kenarlar)
  [-1, 1].forEach(side => {
    for (let row = 0; row < 3; row++) {
      const stand = new THREE.Mesh(
        new THREE.BoxGeometry(1.8, 1.0, FIELD_D * 1.1),
        new THREE.MeshLambertMaterial({ color: rowColors[row] })
      );
      stand.position.set(
        side * (FIELD_W / 2 + 1.2 + row * 1.8),
        0.5 + row * 1.0,
        0
      );
      scene.add(stand);
    }
  });

  // Kule/direk ışıkları (köşelerde)
  [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([sx, sz]) => {
    // Direk
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.22, 12, 10),
      new THREE.MeshPhongMaterial({ color: 0x888888, shininess: 50 })
    );
    pole.position.set(
      sx * (FIELD_W / 2 + 3.5),
      6,
      sz * (FIELD_D / 2 + 4.5)
    );
    pole.castShadow = true;
    scene.add(pole);

    // Işık kafası
    const lamp = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 0.35, 0.8),
      new THREE.MeshPhongMaterial({ color: 0xffffee, emissive: 0x888844, shininess: 80 })
    );
    lamp.position.set(
      sx * (FIELD_W / 2 + 3.5),
      12.3,
      sz * (FIELD_D / 2 + 4.5)
    );
    scene.add(lamp);

    // Nokta ışık
    const pt = new THREE.PointLight(0xfff8e0, 0.6, 30);
    pt.position.set(
      sx * (FIELD_W / 2 + 3.5),
      12,
      sz * (FIELD_D / 2 + 4.5)
    );
    scene.add(pt);
  });
}

buildStands();

// ── ZEMIN IZGARA (kale arkası, sahanın dışı) ────────────────────────
const groundExt = new THREE.Mesh(
  new THREE.BoxGeometry(FIELD_W * 2.2, 0.20, FIELD_D * 3.5),
  new THREE.MeshLambertMaterial({ color: 0x0f1e0f })
);
groundExt.position.y = -0.12;
groundExt.receiveShadow = true;
scene.add(groundExt);

// ════════════════════════════════════════════════════════════════════
//  FAZ 1B — TOP FİZİĞİ + GOL TESPİTİ
// ════════════════════════════════════════════════════════════════════

// ── SABİTLER (fizik) ────────────────────────────────────────────────
const BALL_R     = 0.27;
const GRAVITY    = -22;       // m/s²
const BOUNCE_Y   = 0.62;      // zeminle sekme katsayısı
const BOUNCE_W   = 0.55;      // duvarla sekme katsayısı
const FRIC_ROLL  = 0.978;     // zemin sürtünmesi (kare başına)
const FRIC_AIR   = 0.9985;    // hava direnci
const SPIN_DECAY = 0.94;      // spin sönümlemesi

// ── CANVAS → FUTBOL TOPU DOKUSU ─────────────────────────────────────
function makeBallTexture() {
  const c   = document.createElement('canvas');
  c.width   = 512; c.height = 512;
  const ctx = c.getContext('2d');

  // Beyaz arka plan
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, 512, 512);

  ctx.fillStyle = '#111111';

  // Merkez altıgen
  function hexagon(cx, cy, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i * 60 - 30) * Math.PI / 180;
      const x = cx + r * Math.cos(a);
      const y = cy + r * Math.sin(a);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
  }

  // Siyah beşgen (merkez)
  function pentagon(cx, cy, r) {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * 72 - 90) * Math.PI / 180;
      const x = cx + r * Math.cos(a);
      const y = cy + r * Math.sin(a);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
  }

  pentagon(256, 256, 62);
  // Etrafındaki 5 beşgen
  for (let i = 0; i < 5; i++) {
    const a = (i * 72 - 90) * Math.PI / 180;
    pentagon(256 + 148 * Math.cos(a), 256 + 148 * Math.sin(a), 52);
  }
  // Köşe beşgenleri
  for (let i = 0; i < 5; i++) {
    const a = (i * 72 - 90 + 36) * Math.PI / 180;
    pentagon(256 + 245 * Math.cos(a), 256 + 245 * Math.sin(a), 46);
  }
  // Çizgiler (beşgenler arası)
  ctx.strokeStyle = '#111111';
  ctx.lineWidth   = 6;
  ctx.stroke();

  return new THREE.CanvasTexture(c);
}

// ── TOP MESH ─────────────────────────────────────────────────────────
const ballMesh = new THREE.Mesh(
  new THREE.SphereGeometry(BALL_R, 28, 28),
  new THREE.MeshPhongMaterial({
    map:       makeBallTexture(),
    shininess: 60,
    specular:  new THREE.Color(0x888888)
  })
);
ballMesh.castShadow    = true;
ballMesh.receiveShadow = true;
scene.add(ballMesh);

// Top zemin gölgesi (yüksekliğe göre büyür/küçülür)
const ballShadowMesh = new THREE.Mesh(
  new THREE.CircleGeometry(0.30, 24),
  new THREE.MeshBasicMaterial({
    color: 0x000000, transparent: true, opacity: 0.30
  })
);
ballShadowMesh.rotation.x = -Math.PI / 2;
ballShadowMesh.position.y =  0.006;
scene.add(ballShadowMesh);

// ── TOP DURUMU ───────────────────────────────────────────────────────
const ball = {
  x: 0, y: 2.5, z: 0,       // konum
  vx: 3, vy: 0, vz: 1.5,    // hız (başlangıç hareketi göstermek için)
  spin: new THREE.Vector3()  // dönüş ekseni+hız
};

function resetBall() {
  ball.x = 0; ball.y = 2.5; ball.z = 0;
  ball.vx = (Math.random() - 0.5) * 4;
  ball.vy = 2;
  ball.vz = (Math.random() - 0.5) * 2;
}

// ── GOL DURUMU ───────────────────────────────────────────────────────
let goalCooldown = 0;
const goalMsgEl  = document.getElementById('goal-msg');

function triggerGoal(team) {
  if (goalCooldown > 0) return;
  goalCooldown = 2.5;

  // Mesaj göster
  goalMsgEl.style.display = 'block';
  goalMsgEl.style.animation = 'none';
  // Yeniden animasyon tetikle
  void goalMsgEl.offsetWidth;
  goalMsgEl.style.animation = 'goalPop 0.25s ease-out';

  // 2 sn sonra topu sıfırla
  setTimeout(() => {
    goalMsgEl.style.display = 'none';
    resetBall();
  }, 2200);
}

// ── FİZİK GÜNCELLEMESİ ──────────────────────────────────────────────
function updateBallPhysics(dt) {
  if (goalCooldown > 0) {
    goalCooldown -= dt;
    return; // Gol animasyonu sırasında top donuk
  }

  // Yerçekimi
  ball.vy += GRAVITY * dt;

  // Konum
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  ball.z += ball.vz * dt;

  // Hava direnci
  ball.vx *= FRIC_AIR;
  ball.vz *= FRIC_AIR;

  // ── ZEMIN SEKMESİ ─────────────────────────────────────────────────
  if (ball.y < BALL_R) {
    ball.y   =  BALL_R;
    ball.vy  = -ball.vy * BOUNCE_Y;

    // Yeterince yavaşladıysa yuvarlanmaya geç
    if (Math.abs(ball.vy) < 0.5) ball.vy = 0;

    // Zemin sürtünmesi
    ball.vx *= FRIC_ROLL;
    ball.vz *= FRIC_ROLL;
  }

  // ── TAVAN ─────────────────────────────────────────────────────────
  if (ball.y > 10 - BALL_R) {
    ball.y  =  10 - BALL_R;
    ball.vy = -ball.vy * 0.45;
  }

  // ── Z DUVARLAR (yan sınırlar) ──────────────────────────────────────
  const ZB = FIELD_D / 2 - BALL_R;
  if (Math.abs(ball.z) > ZB) {
    ball.z  =  Math.sign(ball.z) * ZB;
    ball.vz = -ball.vz * BOUNCE_W;
  }

  // ── X DUVARLAR / GOL TESPİTİ ──────────────────────────────────────
  const XB = FIELD_W / 2 - BALL_R;
  if (Math.abs(ball.x) > XB) {

    // Kale bölgesi: y < GOAL_H ve z içinde GOAL_W
    const inGoal = ball.y < GOAL_H && Math.abs(ball.z) < (GOAL_W / 2 - 0.1);

    if (inGoal) {
      // Gol! Hangi takım attı: ball.x > 0 → sağ kaleye → sol takım (Mavi) attı
      triggerGoal(ball.x > 0 ? 0 : 1);
    } else {
      // Saha dışı → duvardan sek
      ball.x  =  Math.sign(ball.x) * XB;
      ball.vx = -ball.vx * BOUNCE_W;
    }
  }

  // ── TOP DÖNÜŞÜ (görsel) ───────────────────────────────────────────
  // Hareket yönüne göre top döner
  ballMesh.rotation.z -= ball.vx * dt * 1.6;
  ballMesh.rotation.x += ball.vz * dt * 1.6;

  // ── MESH GÜNCELLE ─────────────────────────────────────────────────
  ballMesh.position.set(ball.x, ball.y, ball.z);

  // Gölge: yüksekliğe göre opacity ve ölçek
  const heightRatio  = Math.min(ball.y / 7, 1);
  const shadowOpacity = 0.30 * (1 - heightRatio * 0.72);
  const shadowScale   = 0.85 + heightRatio * 0.45;

  ballShadowMesh.position.x        = ball.x;
  ballShadowMesh.position.z        = ball.z;
  ballShadowMesh.material.opacity  = shadowOpacity;
  ballShadowMesh.scale.setScalar(shadowScale);
}

// ════════════════════════════════════════════════════════════════════
//  FAZ 1C — OYUNCULAR · HAREKET · YAPAY ZEKA · SKOR · TIMER
// ════════════════════════════════════════════════════════════════════

const PLAYER_SPD  = 5.6;
const PLAYER_JUMP = 13.5;
const KICK_RANGE  = 0.85;
const KICK_PWR    = 13;
const GAME_SECS   = 180;

// ── OYUNCU MESH (kafa topu stili: büyük kafa) ────────────────────────
function makePlayerMesh(teamColor) {
  const g = new THREE.Group();
  const C = teamColor;
  const phong = (c, sh) => new THREE.MeshPhongMaterial({ color: c, shininess: sh || 35 });

  // Gövde
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.26, 0.68, 14), phong(C));
  body.position.y = 0.34; body.castShadow = true; g.add(body);

  // Büyük kafa
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.46, 22, 22), phong(C, 45));
  head.position.y = 1.03; head.castShadow = true; g.add(head);

  // Gözler
  [-0.17, 0.17].forEach(x => {
    const ew = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), phong(0xffffff, 60));
    ew.position.set(x, 1.09, 0.38); ew.scale.z = 0.55; g.add(ew);
    const ep = new THREE.Mesh(new THREE.SphereGeometry(0.046, 8, 8), phong(0x111111, 80));
    ep.position.set(x, 1.09, 0.43); g.add(ep);
  });

  // Bacaklar + ayakkabı
  [-0.14, 0.14].forEach(x => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.08, 0.50, 10), phong(C));
    leg.position.set(x, -0.09, 0); leg.castShadow = true; g.add(leg);
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.09, 0.28), phong(0x111111));
    shoe.position.set(x, -0.37, 0.05); g.add(shoe);
  });

  return g;
}

// Oyuncu zemin gölgesi
function makePlayerShadow() {
  const m = new THREE.Mesh(
    new THREE.CircleGeometry(0.28, 14),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22 })
  );
  m.rotation.x = -Math.PI / 2;
  m.position.y = 0.004;
  scene.add(m);
  return m;
}

// ── OYUNCU DURUMU ────────────────────────────────────────────────────
const TEAM_COLORS = [0x2255FF, 0xFF2211];

// Başlangıç konumları
const SPAWN = [
  { x: -3.5, z:  0.7 }, // Mavi 1 (İnsan)
  { x: -6.5, z: -0.7 }, // Mavi 2 (YZ)
  { x:  3.5, z:  0.7 }, // Kırmızı 1 (YZ)
  { x:  6.5, z: -0.7 }, // Kırmızı 2 (YZ)
];

let players = [];

function createPlayers() {
  players.forEach(p => { scene.remove(p.mesh); scene.remove(p.shadow); });
  players = SPAWN.map((sp, i) => {
    const team  = i < 2 ? 0 : 1;
    const mesh  = makePlayerMesh(TEAM_COLORS[team]);
    const shad  = makePlayerShadow();
    mesh.position.set(sp.x, 0, sp.z);
    scene.add(mesh);
    return {
      team, idx: i,
      isHuman: i === 0,       // Sadece P0 insan
      x: sp.x, y: 0, z: sp.z,
      vx: 0, vy: 0, vz: 0,
      onGround: true,
      kickCooldown: 0,
      faceLeft: team === 1,
      mesh, shadow: shad,
      spawnX: sp.x, spawnZ: sp.z
    };
  });
}

function spawnPlayers() {
  players.forEach(p => {
    p.x = p.spawnX; p.y = 0; p.z = p.spawnZ;
    p.vx = 0; p.vy = 0; p.vz = 0;
    p.onGround = true; p.kickCooldown = 0;
  });
}

// ── GİRİŞ ────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  const prevent = ['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
  if (prevent.includes(e.code)) e.preventDefault();

  if (!matchActive) return;
  const p = players[0];

  if (e.code === 'ArrowUp' && p.onGround) {
    p.vy = PLAYER_JUMP; p.onGround = false;
  }
  if (e.code === 'Space') kickAction(p);
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function kickAction(p) {
  if (p.kickCooldown > 0) return;
  const dx = ball.x - p.x;
  const dy = ball.y - (p.y + 0.9);
  const dz = ball.z - p.z;
  const d  = Math.sqrt(dx * dx + dy * dy * 0.5 + dz * dz);
  if (d > KICK_RANGE) return;

  const goalX = p.team === 0 ? FIELD_W / 2 : -FIELD_W / 2;
  const toGoalX = goalX - ball.x;
  const len     = Math.sqrt(toGoalX * toGoalX + 0.01);

  ball.vx = (toGoalX / len) * KICK_PWR;
  ball.vy = 5.5 + Math.random() * 2.5;
  ball.vz = -ball.z * 0.9;
  p.kickCooldown = 0.35;
}

// ── İNSAN HAREKETİ ───────────────────────────────────────────────────
function updateHuman(p, dt) {
  if (keys['ArrowLeft'])       { p.vx = -PLAYER_SPD; p.faceLeft = true;  }
  else if (keys['ArrowRight']) { p.vx =  PLAYER_SPD; p.faceLeft = false; }
  else                         { p.vx *= 0.70; }

  // İleri/geri (Z ekseninde kısıtlı)
  if (keys['ArrowDown'])       p.vz =  PLAYER_SPD * 0.50;
  else if (keys['ArrowUp'] && !p.onGround) { /* havada Z hareketi yok */ }
  else if (p.onGround)         p.vz *= 0.70;
}

// ── YAPAY ZEKA ───────────────────────────────────────────────────────
function updateAI(p, dt) {
  const isForward = (p.idx === 1 && p.team === 0) || (p.idx === 2 && p.team === 1)
                    ? false : true;
  // Forvet → topa git, Defans → yarı sahayı koru
  const ownGoalX  = p.team === 0 ? -FIELD_W / 2 : FIELD_W / 2;
  const targetX   = isForward
    ? ball.x
    : ball.x * 0.35 + ownGoalX * 0.65;
  const targetZ   = ball.z * 0.40;

  const dx = targetX - p.x;
  const dz = targetZ - p.z;

  p.vx = Math.sign(dx) * Math.min(Math.abs(dx) * 2.6, PLAYER_SPD * 0.92);
  p.vz = Math.sign(dz) * Math.min(Math.abs(dz) * 1.8, PLAYER_SPD * 0.45);
  p.faceLeft = p.vx < 0;

  // Zıpla: top havadaysa ve yakındaysa
  if (p.onGround) {
    const d2 = Math.sqrt((ball.x - p.x) ** 2 + (ball.z - p.z) ** 2);
    if (d2 < 2.2 && ball.y > 0.9) { p.vy = PLAYER_JUMP * 0.88; p.onGround = false; }
  }

  // YZ vuruşu
  if (p.kickCooldown <= 0) {
    const dx2 = ball.x - p.x, dy2 = ball.y - (p.y + 0.9), dz2 = ball.z - p.z;
    const d   = Math.sqrt(dx2 * dx2 + dy2 * dy2 * 0.5 + dz2 * dz2);
    if (d < KICK_RANGE) {
      const goalX   = p.team === 0 ? FIELD_W / 2 : -FIELD_W / 2;
      ball.vx       = Math.sign(goalX - ball.x) * (KICK_PWR * 0.9);
      ball.vy       = 5 + Math.random() * 3;
      ball.vz       = -ball.z * 0.7;
      p.kickCooldown = 0.55;
    }
  }
}

// ── OYUNCU FİZİĞİ ────────────────────────────────────────────────────
function updatePlayer(p, dt) {
  if (p.kickCooldown > 0) p.kickCooldown -= dt;

  p.vy += GRAVITY * dt;
  p.x  += p.vx * dt;
  p.y  += p.vy * dt;
  p.z  += p.vz * dt;

  // Zemin
  if (p.y <= 0) { p.y = 0; p.vy = 0; p.onGround = true; p.vz *= 0.6; }

  // X sınırları
  const PX = FIELD_W / 2 - 0.3;
  p.x = Math.max(-PX, Math.min(PX, p.x));
  // Z sınırları
  const PZ = FIELD_D / 2 - 0.4;
  p.z = Math.max(-PZ, Math.min(PZ, p.z));

  // Mesh güncelle
  p.mesh.position.set(p.x, p.y, p.z);
  const targetRY = p.faceLeft ? Math.PI : 0;
  p.mesh.rotation.y += (targetRY - p.mesh.rotation.y) * 0.22;
  // Havada hafif eğilme
  p.mesh.rotation.z = p.onGround ? 0 : p.vx * 0.038;

  // Gölge
  p.shadow.position.x = p.x;
  p.shadow.position.z = p.z;
  p.shadow.material.opacity = 0.22 * (1 - Math.min(p.y / 5, 1) * 0.7);
}

// ── MAÇ YÖNETİMİ ─────────────────────────────────────────────────────
let score       = [0, 0];
let timeLeft    = GAME_SECS;
let matchActive = false;
let waitTimer   = 0;

const elScoreA  = document.getElementById('score-a');
const elScoreB  = document.getElementById('score-b');
const elTimer   = document.getElementById('hud-timer');
const elGoalMsg = document.getElementById('goal-msg');
const elRestart = document.getElementById('btn-restart');

function startMatch() {
  score = [0, 0]; timeLeft = GAME_SECS; matchActive = false;
  elScoreA.textContent = '0'; elScoreB.textContent = '0';
  elRestart.style.display = 'none';
  elTimer.classList.remove('warn');
  spawnPlayers();
  resetBall();
  waitTimer = 2.2; // kick-off bekleme süresi
}
window.restartMatch = startMatch;

function onGoal(scoringTeam) {
  if (!matchActive) return;
  matchActive = false;
  score[scoringTeam]++;
  (scoringTeam === 0 ? elScoreA : elScoreB).textContent = score[scoringTeam];

  elGoalMsg.style.display = 'block';
  elGoalMsg.style.animation = 'none';
  void elGoalMsg.offsetWidth;
  elGoalMsg.style.animation = 'goalPop 0.25s ease-out';

  setTimeout(() => {
    elGoalMsg.style.display = 'none';
    if (timeLeft > 0) {
      spawnPlayers(); resetBall(); waitTimer = 1.8;
    }
  }, 2200);
}

// triggerGoal'u üzerine yaz
function triggerGoal(t) { onGoal(t); }

function updateTimer(dt) {
  if (!matchActive) return;
  timeLeft -= dt;
  if (timeLeft <= 0) {
    timeLeft = 0; matchActive = false;
    const w = score[0] > score[1] ? 'MAVİ KAZANDI! 🏆'
            : score[1] > score[0] ? 'KIRMIZI KAZANDI! 🏆'
            : 'BERABERLİK!';
    elGoalMsg.textContent = w;
    elGoalMsg.style.display = 'block';
    elGoalMsg.style.color   = score[0] === score[1] ? '#ffffff' : '#FFD700';
    elRestart.style.display = 'block';
    return;
  }
  const m = Math.floor(timeLeft / 60);
  const s = Math.floor(timeLeft % 60);
  elTimer.textContent = `${m}:${s.toString().padStart(2, '0')}`;
  elTimer.classList.toggle('warn', timeLeft < 30);
}

// ── BAŞLAT ────────────────────────────────────────────────────────────
createPlayers();
startMatch();

// ── ANA DÖNGÜ ─────────────────────────────────────────────────────────
let prevTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt  = Math.min((now - prevTime) / 1000, 0.05);
  prevTime  = now;

  // Kick-off bekleme
  if (waitTimer > 0) {
    waitTimer -= dt;
    if (waitTimer <= 0) { waitTimer = 0; matchActive = true; }
  }

  // Oyuncu güncellemeleri
  players.forEach(p => {
    if (p.isHuman) updateHuman(p, dt);
    else           updateAI(p, dt);
    updatePlayer(p, dt);
  });

  // Top + timer
  updateBallPhysics(dt);
  updateTimer(dt);

  renderer.render(scene, camera);
}
animate();
</script>
